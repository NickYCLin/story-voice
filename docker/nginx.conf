# 這個容器只聽 http；真正的協定由上游主機 nginx 終結 https 後以
# X-Forwarded-Proto 傳進來。這裡若硬寫 $scheme 會把它覆寫成 http，
# 讓 API 永遠以為連線不安全（cookie 拿不到 Secure 屬性）。
map $http_x_forwarded_proto $storyvoice_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    location = /StoryVoice {
        return 308 /StoryVoice/;
    }

    # Public product documents must remain text responses, including subpath deployments.
    location ~ ^/(?:StoryVoice/)?(product\.(?:zh-TW|en)\.md|product\.json|llms\.txt)$ {
        rewrite ^/StoryVoice(/.*)$ $1 break;
        types { text/markdown md; application/json json; text/plain txt; }
        charset utf-8;
        charset_types text/markdown application/json text/plain;
        try_files $uri =404;
    }

    location = /StoryVoice/api/external/v1/speech {
        access_log off;
        client_max_body_size 4k;
        client_body_buffer_size 4k;
        error_page 413 = @external_voice_request_too_large;
        rewrite ^/StoryVoice(/.*)$ $1 break;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $storyvoice_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /StoryVoice;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ASP.NET routing is case-insensitive and accepts a trailing slash. Reject
    # those non-canonical spellings before the generic 11 MiB proxy can buffer
    # their bodies; the exact lowercase location above remains the only API path.
    location ~* ^/StoryVoice/api/external/v1/speech/?$ {
        access_log off;
        client_max_body_size 4k;
        client_body_buffer_size 4k;
        default_type application/problem+json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 400 '{"type":"about:blank","title":"Invalid request","status":400,"detail":"Use the canonical external voice API path.","code":"invalid_request"}';
    }

    location /StoryVoice/api/ {
        rewrite ^/StoryVoice(/.*)$ $1 break;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $storyvoice_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /StoryVoice;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /StoryVoice/health/ {
        rewrite ^/StoryVoice(/.*)$ $1 break;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /StoryVoice;
    }

    location /StoryVoice/ {
        rewrite ^/StoryVoice(/.*)$ $1 break;
        try_files $uri $uri/ /index.html;
    }

    location = /api/external/v1/speech {
        access_log off;
        client_max_body_size 4k;
        client_body_buffer_size 4k;
        error_page 413 = @external_voice_request_too_large;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $storyvoice_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~* ^/api/external/v1/speech/?$ {
        access_log off;
        client_max_body_size 4k;
        client_body_buffer_size 4k;
        default_type application/problem+json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 400 '{"type":"about:blank","title":"Invalid request","status":400,"detail":"Use the canonical external voice API path.","code":"invalid_request"}';
    }

    location @external_voice_request_too_large {
        access_log off;
        default_type application/problem+json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 413 '{"type":"about:blank","title":"Request too large","status":413,"detail":"The request body exceeds the configured limit.","code":"request_too_large"}';
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $storyvoice_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
