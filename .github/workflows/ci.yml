name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore StoryVoice.sln
      - run: dotnet build StoryVoice.sln --configuration Release --no-restore
      - run: dotnet test StoryVoice.sln --configuration Release --no-build --no-restore
      - run: python3 -m unittest discover -s tests/python -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/StoryVoice.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/StoryVoice.Web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build
        env:
          STORYVOICE_BASE_PATH: /StoryVoice/

  bluemagpie-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bluemagpie-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/bluemagpie-gateway/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
