name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: >-
          dotnet restore StoryVoice.sln
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:WarningsAsErrors=NU1900%3BNU1901%3BNU1902%3BNU1903%3BNU1904%3BNU1905
      - run: dotnet build StoryVoice.sln --configuration Release --no-restore
      - name: Install audio test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: dotnet test StoryVoice.sln --configuration Release --no-build --no-restore
      - run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/StoryVoice.Infrastructure
          --startup-project src/StoryVoice.Api
          --configuration Release
          --no-build
      - run: dotnet list StoryVoice.sln package --vulnerable --include-transitive --no-restore
      - run: python3 -m unittest discover -s tests/python -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/StoryVoice.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/StoryVoice.Web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build
        env:
          STORYVOICE_BASE_PATH: /StoryVoice/

  bluemagpie-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bluemagpie-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/bluemagpie-gateway/requirements.txt
            services/bluemagpie-gateway/requirements-test.txt
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install pip==26.2.1
      - run: .venv/bin/python -m pip install -r requirements-test.txt pip-audit==2.10.1
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/python -m compileall -q bluemagpie_gateway tests
      - run: .venv/bin/python -m pip_audit --local --strict

  local-clone-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/local-clone-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/local-clone-gateway/requirements.txt
            services/local-clone-gateway/requirements-test.txt
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install pip==26.2.1
      - run: .venv/bin/python -m pip install -r requirements-test.txt pip-audit==2.10.1
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/python -m compileall -q local_clone_gateway tests
      - run: .venv/bin/python -m pip_audit --local --strict
      - run: docker build --tag storyvoice-local-clone-gateway:ci .

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose -f compose.yml -f compose.metrics.yml --profile metrics config --quiet

  metrics:
    runs-on: ubuntu-latest
    env:
      STORYVOICE_METRICS_PORT: 19090
    steps:
      - uses: actions/checkout@v7
      - name: Validate Collector and Prometheus configuration
        run: |
          docker compose -p storyvoice-metrics-ci -f compose.metrics.yml --profile metrics run --rm --no-deps metrics-collector validate --config=/etc/storyvoice/collector.yml
          docker compose -p storyvoice-metrics-ci -f compose.metrics.yml --profile metrics run --rm --no-deps --entrypoint /bin/promtool metrics-prometheus check config /etc/storyvoice/prometheus.yml
          docker compose -p storyvoice-metrics-ci -f compose.metrics.yml --profile metrics run --rm --no-deps --entrypoint /bin/promtool metrics-prometheus test rules /etc/storyvoice/alerts.test.yml
      - name: Check synthetic OTLP ingestion and filtering
        run: |
          docker compose -p storyvoice-metrics-ci -f compose.metrics.yml -f ops/metrics/compose.test.yml --profile metrics up -d
          python3 tests/metrics/test_stack.py
      - name: Remove test stack
        if: always()
        run: docker compose -p storyvoice-metrics-ci -f compose.metrics.yml --profile metrics down --volumes
