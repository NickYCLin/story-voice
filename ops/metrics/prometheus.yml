global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 1m

rule_files:
  - /etc/storyvoice/alerts.yml

scrape_configs:
  - job_name: storyvoice-collector
    honor_labels: true
    static_configs:
      - targets: ["metrics-collector:9464"]

# Alertmanager delivery is intentionally unconfigured until an operator selects a receiver.
