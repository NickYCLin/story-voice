name: storyvoice

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storyvoice
      POSTGRES_USER: storyvoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storyvoice_local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyvoice -d storyvoice"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default
      - bluemagpie-internal
      - local-gpu-lock-internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=storyvoice;Username=storyvoice;Password=${POSTGRES_PASSWORD:-storyvoice_local}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      BookStorage__RootPath: /data/books
      CharacterVoiceStorage__RootPath: /data/character-voices
      CharacterAvatarStorage__RootPath: /data/character-avatars
      ThreeWaAiHub__BaseUrl: ${THREEWA_BASE_URL:-https://3wa.tw/3waAIHub/}
      ThreeWaAiHub__ApiToken: ${THREEWA_API_TOKEN:-}
      Narration__AudioRootPath: /data/audio
      Narration__AdmissionEnabled: ${NARRATION_ADMISSION_ENABLED:-false}
      Auth__DataProtectionKeysPath: /var/lib/storyvoice/data-protection-keys
      BlueMagpie__Enabled: ${BLUEMAGPIE_ENABLED:-false}
      BlueMagpie__FormalNarrationEnabled: ${BLUEMAGPIE_FORMAL_NARRATION_ENABLED:-false}
      BlueMagpie__BaseUrl: http://bluemagpie-gateway:8081/
      BlueMagpie__InternalToken: ${BLUEMAGPIE_INTERNAL_TOKEN:-}
      BlueMagpie__ModelRevision: 6f7cab914a1e27c56b504ec663c0144dc25cc0a3
      BlueMagpie__QueueTimeoutSeconds: ${BLUEMAGPIE_QUEUE_TIMEOUT_SECONDS:-15}
      BlueMagpie__SynthesisWatchdogSeconds: ${BLUEMAGPIE_SYNTHESIS_WATCHDOG_SECONDS:-120}
      BlueMagpie__ModelLifecycleWatchdogSeconds: ${BLUEMAGPIE_MODEL_LIFECYCLE_WATCHDOG_SECONDS:-120}
      BlueMagpie__RequestTimeoutSeconds: ${BLUEMAGPIE_REQUEST_TIMEOUT_SECONDS:-180}
      BlueMagpie__MaximumResponseBytes: ${BLUEMAGPIE_MAXIMUM_RESPONSE_BYTES:-5242880}
      BlueMagpie__MaximumChunksPerJob: ${BLUEMAGPIE_MAXIMUM_CHUNKS_PER_JOB:-10000}
      BlueMagpie__MaximumJobAudioBytes: ${BLUEMAGPIE_MAXIMUM_JOB_AUDIO_BYTES:-8589934592}
      LocalClonePreview__Enabled: ${LOCAL_CLONE_PREVIEW_ENABLED:-false}
      LocalClonePreview__GatewayBaseUrl: http://local-clone-gateway:8082/
      LocalClonePreview__InternalToken: ${LOCAL_CLONE_INTERNAL_TOKEN:-}
      LocalClonePreview__AssetRootPath: /data/local-clone-assets
      LocalClonePreview__ConnectTimeoutSeconds: 10
      LocalClonePreview__RequestTimeoutSeconds: 240
      LocalClonePreview__MaximumResponseBytes: 16777216
      LocalClonePreview__AllowedProfiles__a592496c-6f83-4a35-b36d-0f8149af74a6__Label: ${LOCAL_CLONE_CHU_MING_YANG_LABEL:-褚冥漾（周子謙 AI 合成聲線・由建立者管理｜私人試音）}
      LocalClonePreview__AllowedProfiles__a592496c-6f83-4a35-b36d-0f8149af74a6__ReferenceAudioRelativePath: chu-ming-yang/reference.wav
      LocalClonePreview__AllowedProfiles__a592496c-6f83-4a35-b36d-0f8149af74a6__TranscriptRelativePath: chu-ming-yang/transcript.txt
      LocalClonePreview__AllowedProfiles__a592496c-6f83-4a35-b36d-0f8149af74a6__ExpectedReferenceAudioSha256: ${LOCAL_CLONE_CHU_MING_YANG_REFERENCE_SHA256:-}
      LocalClonePreview__AllowedProfiles__a592496c-6f83-4a35-b36d-0f8149af74a6__ExpectedTranscriptSha256: ${LOCAL_CLONE_CHU_MING_YANG_TRANSCRIPT_SHA256:-}
      LocalClonePreview__AllowedProfiles__512ef88f-a4db-4c6c-b586-082a17a28274__Label: ${LOCAL_CLONE_LIN_RUO_QING_LABEL:-林若晴（AI 合成聲線・由建立者管理｜私人試音）}
      LocalClonePreview__AllowedProfiles__512ef88f-a4db-4c6c-b586-082a17a28274__ReferenceAudioRelativePath: lin-ruo-qing/reference.wav
      LocalClonePreview__AllowedProfiles__512ef88f-a4db-4c6c-b586-082a17a28274__TranscriptRelativePath: lin-ruo-qing/transcript.txt
      LocalClonePreview__AllowedProfiles__512ef88f-a4db-4c6c-b586-082a17a28274__ExpectedReferenceAudioSha256: ${LOCAL_CLONE_LIN_RUO_QING_REFERENCE_SHA256:-}
      LocalClonePreview__AllowedProfiles__512ef88f-a4db-4c6c-b586-082a17a28274__ExpectedTranscriptSha256: ${LOCAL_CLONE_LIN_RUO_QING_TRANSCRIPT_SHA256:-}
      VoiceCatalog__Enabled: ${VOICE_CATALOG_ENABLED:-false}
      VoiceCatalog__AssetRootPath: /data/voice-catalog-assets
      VoiceCatalog__MaximumDemoBytes: ${VOICE_CATALOG_MAXIMUM_DEMO_BYTES:-3145728}
      ExternalVoiceApi__Enabled: ${EXTERNAL_VOICE_API_ENABLED:-false}
      ExternalVoiceApi__MaximumRequestBytes: ${EXTERNAL_VOICE_API_MAXIMUM_REQUEST_BYTES:-4096}
      ExternalVoiceApi__MaximumTextCharacters: ${EXTERNAL_VOICE_API_MAXIMUM_TEXT_CHARACTERS:-200}
      ExternalVoiceApi__MaximumTextUtf8Bytes: ${EXTERNAL_VOICE_API_MAXIMUM_TEXT_UTF8_BYTES:-2048}
      ExternalVoiceApi__MaximumResponseBytes: ${EXTERNAL_VOICE_API_MAXIMUM_RESPONSE_BYTES:-3145728}
      ExternalVoiceApi__RequestsPerMinute: ${EXTERNAL_VOICE_API_REQUESTS_PER_MINUTE:-3}
      ExternalVoiceApi__PreAuthenticationRequestsPerMinute: ${EXTERNAL_VOICE_API_PRE_AUTHENTICATION_REQUESTS_PER_MINUTE:-60}
      ExternalVoiceApi__PreAuthenticationGlobalRequestsPerMinute: ${EXTERNAL_VOICE_API_PRE_AUTHENTICATION_GLOBAL_REQUESTS_PER_MINUTE:-600}
      ExternalVoiceApi__IdempotencyCacheEntries: ${EXTERNAL_VOICE_API_IDEMPOTENCY_CACHE_ENTRIES:-32}
      ExternalVoiceApi__IdempotencyTtlMinutes: ${EXTERNAL_VOICE_API_IDEMPOTENCY_TTL_MINUTES:-10}
      ExternalVoiceApi__UsageLedgerQueueCapacity: ${EXTERNAL_VOICE_API_USAGE_LEDGER_QUEUE_CAPACITY:-1024}
    volumes:
      - book-storage:/data/books
      - character-voice-storage:/data/character-voices
      - character-avatar-storage:/data/character-avatars
      - audio-storage:/data/audio:ro
      - local-clone-assets:/data/local-clone-assets:ro
      - voice-catalog-assets:/data/voice-catalog-assets:ro
      - data-protection-keys:/var/lib/storyvoice/data-protection-keys
    ports:
      - "127.0.0.1:${STORYVOICE_API_PORT:-8080}:8080"
    networks:
      - default
      - bluemagpie-internal
      - local-clone-api-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=storyvoice;Username=storyvoice;Password=${POSTGRES_PASSWORD:-storyvoice_local}
      BookStorage__RootPath: /data/books
      ThreeWaAiHub__BaseUrl: ${THREEWA_BASE_URL:-https://3wa.tw/3waAIHub/}
      ThreeWaAiHub__ApiToken: ${THREEWA_API_TOKEN:-}
      VoAi__BaseUrl: ${VOAI_BASE_URL:-https://connect.voai.ai/}
      # Paid VoAI calls are opt-in. A legacy VOAI_API_KEY is intentionally ignored.
      VoAi__ApiKey: ${VOAI_PAID_API_KEY:-}
      BlueMagpie__Enabled: ${BLUEMAGPIE_ENABLED:-false}
      BlueMagpie__FormalNarrationEnabled: ${BLUEMAGPIE_FORMAL_NARRATION_ENABLED:-false}
      BlueMagpie__BaseUrl: http://bluemagpie-gateway:8081/
      BlueMagpie__InternalToken: ${BLUEMAGPIE_INTERNAL_TOKEN:-}
      BlueMagpie__ModelRevision: 6f7cab914a1e27c56b504ec663c0144dc25cc0a3
      BlueMagpie__QueueTimeoutSeconds: ${BLUEMAGPIE_QUEUE_TIMEOUT_SECONDS:-15}
      BlueMagpie__SynthesisWatchdogSeconds: ${BLUEMAGPIE_SYNTHESIS_WATCHDOG_SECONDS:-120}
      BlueMagpie__ModelLifecycleWatchdogSeconds: ${BLUEMAGPIE_MODEL_LIFECYCLE_WATCHDOG_SECONDS:-120}
      BlueMagpie__RequestTimeoutSeconds: ${BLUEMAGPIE_REQUEST_TIMEOUT_SECONDS:-180}
      BlueMagpie__MaximumResponseBytes: ${BLUEMAGPIE_MAXIMUM_RESPONSE_BYTES:-5242880}
      BlueMagpie__MaximumChunksPerJob: ${BLUEMAGPIE_MAXIMUM_CHUNKS_PER_JOB:-10000}
      BlueMagpie__MaximumJobAudioBytes: ${BLUEMAGPIE_MAXIMUM_JOB_AUDIO_BYTES:-8589934592}
      BlueMagpieChunkCache__RootPath: /data/bluemagpie-cache
      BlueMagpieChunkCache__MaximumBytes: ${BLUEMAGPIE_CHUNK_CACHE_MAXIMUM_BYTES:-34359738368}
      BlueMagpieChunkCache__LowWatermarkBytes: ${BLUEMAGPIE_CHUNK_CACHE_LOW_WATERMARK_BYTES:-25769803776}
      BlueMagpieChunkCache__MinimumFreeBytes: ${BLUEMAGPIE_CHUNK_CACHE_MINIMUM_FREE_BYTES:-68719476736}
      BlueMagpieChunkCache__RetentionHours: ${BLUEMAGPIE_CHUNK_CACHE_RETENTION_HOURS:-168}
      BlueMagpieChunkCache__CleanupIntervalMinutes: ${BLUEMAGPIE_CHUNK_CACHE_CLEANUP_INTERVAL_MINUTES:-30}
      BlueMagpieChunkCache__TemporaryEntryRetentionMinutes: ${BLUEMAGPIE_CHUNK_CACHE_TEMP_RETENTION_MINUTES:-60}
      Narration__AudioRootPath: /data/audio
      Narration__Voice: zh-TW-YunJheNeural
      Narration__Rate: -5%
      Narration__ProviderTimeoutMinutes: ${NARRATION_PROVIDER_TIMEOUT_MINUTES:-180}
      Narration__LeaseMinutes: ${NARRATION_LEASE_MINUTES:-5}
    volumes:
      - book-storage:/data/books
      - audio-storage:/data/audio
      - bluemagpie-chunk-cache:/data/bluemagpie-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - default
      - bluemagpie-internal
    stop_grace_period: 60s
    restart: unless-stopped

  bluemagpie-gateway:
    profiles: ["bluemagpie"]
    build:
      context: services/bluemagpie-gateway
      dockerfile: Dockerfile
    environment:
      BLUEMAGPIE_INTERNAL_TOKEN: ${BLUEMAGPIE_INTERNAL_TOKEN:-}
      BLUEMAGPIE_QUEUE_TIMEOUT_SECONDS: ${BLUEMAGPIE_QUEUE_TIMEOUT_SECONDS:-15}
      BLUEMAGPIE_REDIS_URL: redis://redis:6379/0
      BLUEMAGPIE_SYNTHESIS_WATCHDOG_SECONDS: ${BLUEMAGPIE_SYNTHESIS_WATCHDOG_SECONDS:-120}
      BLUEMAGPIE_MODEL_LIFECYCLE_WATCHDOG_SECONDS: ${BLUEMAGPIE_MODEL_LIFECYCLE_WATCHDOG_SECONDS:-120}
    volumes:
      - ${BLUEMAGPIE_CACHE_PATH:-./.cache/bluemagpie}:/cache:ro
    expose:
      - "8081"
    networks:
      - bluemagpie-internal
    gpus: all
    cpus: 8.0
    mem_limit: 32g
    memswap_limit: 32g
    shm_size: 1g
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  local-clone-gateway:
    profiles: ["local-clone"]
    build:
      context: services/local-clone-gateway
      dockerfile: Dockerfile
    environment:
      LOCAL_CLONE_INTERNAL_TOKEN: ${LOCAL_CLONE_INTERNAL_TOKEN:-}
      LOCAL_CLONE_QUEUE_TIMEOUT_SECONDS: ${LOCAL_CLONE_GATEWAY_QUEUE_TIMEOUT_SECONDS:-15}
      LOCAL_CLONE_SYNTHESIS_WATCHDOG_SECONDS: ${LOCAL_CLONE_GATEWAY_SYNTHESIS_WATCHDOG_SECONDS:-180}
      LOCAL_CLONE_READY_TIMEOUT_SECONDS: ${LOCAL_CLONE_GATEWAY_READY_TIMEOUT_SECONDS:-3}
    expose:
      - "8082"
    networks:
      - local-clone-api-internal
      - local-clone-upstream-internal
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        STORYVOICE_BASE_PATH: ${STORYVOICE_BASE_PATH:-/}
    ports:
      - "127.0.0.1:${STORYVOICE_WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  book-storage:
  character-voice-storage:
  character-avatar-storage:
  audio-storage:
  bluemagpie-chunk-cache:
  local-clone-assets:
  voice-catalog-assets:
  data-protection-keys:

networks:
  bluemagpie-internal:
    internal: true
  local-clone-api-internal:
    name: storyvoice_local-clone-api-internal
    internal: true
  local-clone-upstream-internal:
    name: storyvoice_local-clone-upstream-internal
    internal: true
  local-gpu-lock-internal:
    name: storyvoice_local-gpu-lock-internal
    internal: true
